[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hyprwhispr"
version = "1.1.0"
description = "Local hold-to-talk desktop assistant for Hyprland: whisper.cpp + Ollama, text-only."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "hyprwhispr contributors" }]
keywords = ["hyprland", "whisper", "ollama", "voice-assistant", "local-first", "push-to-talk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment :: Window Managers",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
# The runtime uses only the Python standard library.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
# Optional lower-CPU wake-word engine (openWakeWord code is Apache-2.0; its
# pre-trained models are CC-BY-NC-SA-4.0 and English-only). The default wake-word
# engine reuses whisper.cpp and needs no extra package. See docs/wake-word.md.
wakeword = ["openwakeword"]

[project.scripts]
hyprwhispr = "hyprwhispr.cli:main"

[project.urls]
Homepage = "https://github.com/Fl1pMoniz/hyprwhispr"
Issues = "https://github.com/Fl1pMoniz/hyprwhispr/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
