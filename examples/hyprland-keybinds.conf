# hyprwhispr — hold-to-talk binding for Hyprland (hyprlang config)
#
# `bind` runs on key press, `bindr` runs on key release. Together they give a
# true press-and-hold: recording starts when you press, stops when you release.
# Add these lines to your Hyprland config (usually ~/.config/hypr/hyprland.conf)
# and run `hyprctl reload`. Pick any key combination that is not already used.

bind  = SUPER, V, exec, hyprwhispr record-start
bindr = SUPER, V, exec, hyprwhispr record-stop
